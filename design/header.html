<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makrious Ayman — neural signal header</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0d1117; }
.header { width: 960px; height: 280px; position: relative; overflow: hidden; border: 1px solid #273245; border-radius: 18px; background: #0d1117; }
.network { position: absolute; inset: 0; }
.edge { position: absolute; height: 1px; transform-origin: left center; background: #253951; }
.edge.right { background: #38324f; }
.signal { position: absolute; left: 0; top: -1px; width: 15px; height: 3px; background: linear-gradient(90deg, transparent, #38bdf8); border-radius: 100%; box-shadow: 3px 0 7px #38bdf866; animation: transmit 3.2s linear infinite; }
.right .signal { background: linear-gradient(90deg, transparent, #a78bfa); box-shadow: 3px 0 7px #a78bfa66; }
.node { position: absolute; width: 9px; height: 9px; margin: -4px; border: 1px solid #38bdf8; border-radius: 50%; background: #122538; box-shadow: 0 0 0 5px #38bdf808; }
.node.right { border-color: #a78bfa; background: #241e38; box-shadow: 0 0 0 5px #a78bfa08; }
.node.inner { width: 12px; height: 12px; margin: -6px; box-shadow: 0 0 16px #38bdf830; }
.node.inner.right { box-shadow: 0 0 16px #a78bfa30; }
.identity { position: absolute; inset: 78px 180px auto; text-align: center; }
h1 { margin: 0; color: #f0f6fc; font: 600 70px/1.2 Bahnschrift, 'Segoe UI', sans-serif; letter-spacing: -2.5px; white-space: nowrap; }
p { margin: 18px 0 0; color: #7dd3fc; font: 500 28px/1.3 'Segoe UI', sans-serif; letter-spacing: 2px; }
.accent { display: inline-block; width: 5px; height: 5px; vertical-align: middle; margin: 0 18px 4px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 10px #a78bfa66; }
@keyframes transmit { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 15px); opacity: 0; } }
@media(prefers-reduced-motion: reduce) { .signal { animation: none; opacity: .6; left: 45%; } }
</style>
</head>
<body>
<div class="header">
  <div class="network" aria-hidden="true"></div>
  <div class="identity"><h1>Makrious Ayman</h1><p><span class="accent"></span>AI Engineer<span class="accent"></span></p></div>
</div>
<script>
const points = [[27,42],[27,140],[27,238],[100,87],[100,193],[180,42],[180,140],[180,238]];
const connections = [[0,3],[1,3],[1,4],[2,4],[3,5],[3,6],[4,6],[4,7]];
const network = document.querySelector('.network');
for (const mirrored of [false, true]) {
  const coords = points.map(([x,y]) => [mirrored ? 960-x : x,y]);
  connections.forEach(([a,b],i) => {
    const [x,y] = coords[a], [xx,yy] = coords[b];
    const edge = document.createElement('div');
    edge.className = 'edge' + (mirrored ? ' right' : '');
    Object.assign(edge.style, { left:`${x}px`, top:`${y}px`, width:`${Math.hypot(xx-x,yy-y)}px`, transform:`rotate(${Math.atan2(yy-y,xx-x)}rad)` });
    const signal = document.createElement('span'); signal.className = 'signal'; signal.style.animationDelay = `${-(i%4)*.8}s`;
    edge.append(signal); network.append(edge);
  });
  coords.forEach(([x,y],i) => {
    const node = document.createElement('div'); node.className = 'node' + (mirrored ? ' right' : '') + (i>4 ? ' inner' : '');
    Object.assign(node.style, { left:`${x}px`, top:`${y}px` }); network.append(node);
  });
}
window.setFrame = ms => document.getAnimations().forEach(animation => { animation.pause(); animation.currentTime = ms; });
</script>
</body>
</html>
